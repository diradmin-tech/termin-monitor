name: Terminmonitor

on:
  schedule:
    - cron: "*/5 * * * *"   # alle 15 Minuten (GitHub: Verzögerungen möglich)
  workflow_dispatch:          # manuell auslösbar zum Testen

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Check appointments
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_termin.py

      - name: Upload screenshot (bei Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seite-screenshot
          path: screenshot.png
          if-no-files-found: ignore
